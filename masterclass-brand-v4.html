const Q=new URLSearchParams(location.search),C=Q.get('c')||'zoom',F=Q.get('f')||'4x5',V=Q.get('v')||'a',T=Q.get('t')||'gold';
const sizes={'1x1':[1080,1080],'1x1hi':[1440,1440],'4x5':[1080,1350],'4x5hi':[1440,1800],'9x16m':[1080,1920],'9x16':[1080,1920],'9x16hi':[1440,2560],'191x1':[1200,628],'16x9':[1920,1080]};

 ?'<span>The Longevity</span><em>Masterclass'+(C==='zoom'?' ':'<br>')+'of the Year</em>'

document.querySelector('.benefit').innerHTML=V==='a'
 ?'The world’s 2nd slowest ager<br><em>reveals her protocol.</em>'

document.querySelector('.points').innerHTML='<li>60 minutes live on Zoom</li><li>Her daily longevity protocol</li>';
if(V==='b'&&C==='portrait')document.querySelector('.points').innerHTML='<li>The Longevity Masterclass of the Year</li>';
window.__ready=false;
document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?Promise.resolve():i.decode().catch(()=>{})))).then(()=>{
window.__meta={version:'brand-v4',concept:C,copy:V,tone:T,format:F,w,h,reviewOnly:true,fonts:['PlayfairDisplay.ttf','PlayfairDisplay-Italic.ttf','Inter.ttf']};
requestAnimationFrame(()=>requestAnimationFrame(()=>window.__ready=true));
});

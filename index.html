<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLA · Meta &amp; Instagram Paid Media</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--ink:#f2f6ff;--dim:#8f9db8;--blue:#9cc2ee;--gold:#e3cb96;--line:rgba(140,190,255,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#rail{display:flex;align-items:stretch;height:100dvh;overflow-x:auto;overflow-y:hidden;
scroll-snap-type:x proximity;scroll-behavior:smooth;padding:0 0 0 0}
#rail::-webkit-scrollbar{height:8px}
#rail::-webkit-scrollbar-thumb{background:rgba(156,194,238,.35);border-radius:4px}
.panel{flex:none;height:100dvh;display:flex;flex-direction:column;justify-content:center;
padding:64px 60px;scroll-snap-align:start;position:relative}
.panel+.panel{border-left:1px solid var(--line)}

/* Title */
.title{width:min(96vw,1180px);background:radial-gradient(80% 70% at 20% 10%,rgba(60,110,200,.28),transparent 70%)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.32em;color:var(--blue);text-transform:uppercase}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(46px,6.4vw,104px);line-height:1;letter-spacing:-.025em;margin-top:24px}
h1 em{font-style:italic;background:linear-gradient(100deg,#e8f1ff,#9cc2ee 55%,#6f9dd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin-top:30px;max-width:820px;font-size:21px;line-height:1.6;color:var(--dim)}
.stats{display:flex;gap:52px;margin-top:52px;flex-wrap:wrap}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:60px;line-height:1;color:#fff}
.stat span{display:block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.hint{margin-top:56px;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--dim)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 10px;
border:1px solid var(--line);border-radius:8px;background:rgba(16,26,48,.7);color:#dbe7fb;font-weight:700}

/* Section divider panel */
.chapter{width:min(74vw,620px)}
.chapter .num{font-family:'Playfair Display',serif;font-size:22px;color:var(--blue);letter-spacing:.1em}
.chapter h2{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(38px,4.6vw,68px);line-height:1.04;letter-spacing:-.02em;margin-top:20px}
.chapter p{margin-top:22px;font-size:18px;line-height:1.6;color:var(--dim)}
.chapter.gold .num{color:var(--gold)}

/* Ad slide */
.slide{width:auto}
.slide .meta{display:flex;align-items:flex-end;gap:26px;margin-bottom:22px}
.slide .ratio{font-family:'Playfair Display',serif;font-weight:700;font-size:44px;line-height:1}
.slide .px{font-size:26px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.slide.g .px{color:var(--gold)}
.slide .tagx{font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:6px 10px;border-radius:5px;
background:rgba(46,224,138,.16);color:#5ef0ab;border:1px solid rgba(46,224,138,.34)}
.frame{display:flex;align-items:center;justify-content:center;background:#02040a;border:1px solid var(--line);
border-radius:14px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.frame img{display:block;max-height:60vh;width:auto;border-radius:6px}
.foot{display:flex;align-items:center;gap:18px;margin-top:20px;flex-wrap:wrap}
.place{font-size:14px;color:var(--dim);max-width:52ch;line-height:1.5}
.dl{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:10px;text-decoration:none;
font-size:14px;font-weight:800;background:linear-gradient(180deg,#a8cbf5,#6f9dd8);color:#04101f;white-space:nowrap}
.slide.g .dl{background:linear-gradient(180deg,#f2e0b8,#c8a45c)}
.dl:hover{filter:brightness(1.1)}
.safe{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5ef0ab;white-space:nowrap}

/* Concept slide: 2-row grid inside one panel */
.cgrid{display:grid;grid-template-rows:1fr 1fr;grid-auto-flow:column;gap:26px;height:74vh}
.ctile{display:flex;flex-direction:column;gap:10px;width:calc(37vh)}
.ctile .fr{flex:1;display:flex;align-items:center;justify-content:center;background:#02040a;
border:1px solid var(--line);border-radius:12px;padding:10px;overflow:hidden}
.ctile img{max-height:100%;max-width:100%;width:auto;display:block;border-radius:5px}
.ctile .lb{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#c8d6ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctile a{font-size:11.5px;font-weight:800;color:#04101f;background:linear-gradient(180deg,#a8cbf5,#6f9dd8);
padding:8px 12px;border-radius:7px;text-decoration:none;text-align:center}

/* Chrome */
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:18px;
padding:0 22px;background:linear-gradient(180deg,rgba(4,6,12,.96),rgba(4,6,12,.6));z-index:40;
border-bottom:1px solid var(--line);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim)}
#top a{color:#cfe0ff;text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:8px;letter-spacing:.08em}
#top a:hover{border-color:rgba(156,194,238,.5);color:#fff}
#pos{margin-left:auto;color:var(--blue);font-variant-numeric:tabular-nums}
.panel{padding-top:104px}
#bar{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#9cc2ee,#e3cb96);z-index:40;width:0}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:41;width:52px;height:52px;border-radius:50%;
border:1px solid var(--line);background:rgba(10,18,34,.86);color:#dbe7fb;font-size:22px;cursor:pointer;
display:flex;align-items:center;justify-content:center}
.nav:hover{background:rgba(24,40,72,.95);color:#fff}
#prev{left:16px} #next{right:16px}

/* ---------- Mobile: vertical swipe, native scrolling ---------- */
@media (max-width:860px), (hover:none) and (pointer:coarse){
  html,body{height:auto!important;min-height:0!important;overflow:visible!important;-webkit-text-size-adjust:100%}
  body{overscroll-behavior-y:auto}
  #rail{display:block;height:auto;overflow:visible;scroll-snap-type:y proximity;
        overflow-y:visible;-webkit-overflow-scrolling:touch}
  .panel{width:100%!important;height:auto;min-height:auto;flex:none;display:block;
         padding:26px 20px 40px;scroll-snap-align:start;scroll-margin-top:60px;border-left:none!important}
  .panel:first-child{padding-top:86px}
  html{scroll-padding-top:60px}
  .panel+.panel{border-top:1px solid var(--line)}
  .nav{display:none!important}
  #bar{display:none}
  .frame{padding:10px;border-radius:12px}
  .frame img{max-height:64dvh;max-width:100%;width:auto;height:auto;margin:0 auto}
  .frame{display:flex;align-items:center;justify-content:center}
  .slide .meta{flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .slide .ratio{font-size:32px}
  .slide .px{font-size:20px}
  .foot{gap:12px;margin-top:14px}
  .dl{width:100%;justify-content:center;padding:15px 18px}
  .place{max-width:100%;font-size:13px}
  h1{font-size:40px}
  .lede{font-size:17px;margin-top:20px}
  .stats{gap:26px;margin-top:34px}
  .stat b{font-size:40px}
  .hint{display:none}
  .title,.chapter{width:100%!important}
  .chapter h2{font-size:32px}
  .chapter p{font-size:16px}
  /* concepts: single column stack on phones */
  .cgrid{display:block;height:auto}
  .ctile{width:100%!important;margin-bottom:26px}
  .ctile .fr{padding:8px}
  .ctile img{max-height:56dvh;width:auto;max-width:100%;margin:0 auto}
  .ctile .lb{white-space:normal}
  .ctile a{padding:13px 12px;font-size:13px}
  #top{height:52px;padding:0 12px;gap:8px;overflow-x:auto;white-space:nowrap;font-size:10.5px}
  #top a{padding:7px 10px;font-size:10.5px;flex:none}
  #top span:first-child{flex:none}
  #pos{display:none}
}
</style></head>

let panels=[], idx=0;
function measure(){
  panels=[...document.querySelectorAll('.panel')];
  document.getElementById('pos').textContent='1 / '+panels.length;
  update();
}
function go(n){
  idx=Math.max(0,Math.min(panels.length-1,n));
  if(MOBILE) panels[idx].scrollIntoView({behavior:'smooth',block:'start'});
  else rail.scrollTo({left:panels[idx].offsetLeft,behavior:'smooth'});
  update();
}
function update(){
  if(!panels.length) return;
  document.getElementById('pos').textContent=(idx+1)+' / '+panels.length;
  document.getElementById('bar').style.width=((idx+1)/panels.length*100)+'%';
}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
  if(e.key==='Home')go(0); if(e.key==='End')go(panels.length-1);
});
/* vertical wheel drives horizontal travel */
const MOBILE = matchMedia('(max-width:860px), (hover:none) and (pointer:coarse)').matches;
if(!MOBILE){
  rail.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();rail.scrollLeft+=e.deltaY*1.6;}
  },{passive:false});
}
if(!MOBILE){
  rail.addEventListener('scroll',()=>{
    let best=0,bd=1e9;
    panels.forEach((p,i)=>{const d=Math.abs(p.offsetLeft-rail.scrollLeft);if(d<bd){bd=d;best=i;}});
    idx=best; update();
  },{passive:true});
}
